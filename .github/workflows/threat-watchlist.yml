name: Threat Watchlist

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:          # allow manual runs from the Actions tab

permissions:
  contents: write   # commit last-seen.json updates
  issues: write     # open alerts when something suspicious is found

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run watchlist checker
        run: python .github/scripts/watchlist_checker.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Commit last-seen updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add threats/last-seen.json
          git diff --staged --quiet || git commit -m "chore(watchlist): update last-seen versions [skip ci]"
          git push
