name: Threat Watchlist

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:          # allow manual runs from the Actions tab

permissions:
  contents: write   # push last-seen.json to watchlist-state branch
  issues: write     # open alerts when something suspicious is found

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main (scripts + watchlist.json)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Checkout watchlist-state branch (last-seen.json state)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: watchlist-state
          path: watchlist-state
        continue-on-error: true  # branch won't exist on first run

      - name: Restore last-seen.json
        run: |
          if [ -f watchlist-state/threats/last-seen.json ]; then
            cp watchlist-state/threats/last-seen.json threats/last-seen.json
            echo "Restored last-seen.json from watchlist-state branch"
          else
            echo "No prior state found — first run, starting fresh"
          fi

      - name: Run watchlist checker
        run: python .github/scripts/watchlist_checker.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Push last-seen to watchlist-state branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -d watchlist-state/.git ]; then
            # Branch already existed — update it
            mkdir -p watchlist-state/threats
            cp threats/last-seen.json watchlist-state/threats/last-seen.json
            cd watchlist-state
            git add threats/last-seen.json
            git diff --staged --quiet || git commit -m "chore(watchlist): update last-seen versions [skip ci]"
            git push origin HEAD:watchlist-state
          else
            # First run — create orphan branch with just the state file
            mkdir -p /tmp/ws-init
            cd /tmp/ws-init
            git init
            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git checkout --orphan watchlist-state
            mkdir -p threats
            cp "$GITHUB_WORKSPACE/threats/last-seen.json" threats/last-seen.json
            git add threats/last-seen.json
            git commit -m "chore(watchlist): initialize last-seen state [skip ci]"
            git push origin watchlist-state
          fi
